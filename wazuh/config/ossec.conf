<!--
  Wazuh Agent Configuration for Aegis deployment (ThinkPad)

  This ossec.conf is bind-mounted into the Wazuh agent container.
  On bare-metal installs: copy to /var/ossec/etc/ossec.conf

  Manager address: 127.0.0.1 (local Docker) OR Tailscale IP (100.126.159.28)
  when running agent on a different tailnet node (pi5, tuf-gaming).

  To enroll a remote node:
    WAZUH_MANAGER=100.126.159.28 WAZUH_AGENT_NAME=pi5-orchestrator \
      docker run --rm wazuh/wazuh-agent:4.7.0
-->
<ossec_config>
  <client>
    <server>
      <!-- Uses WAZUH_MANAGER env var if set, falls back to localhost -->
      <address>${WAZUH_MANAGER:-127.0.0.1}</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>linux, ubuntu</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- ── File Integrity Monitoring ───────────────────────────────────── -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>3600</frequency>   <!-- full scan every hour -->
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore frequency="10" timeframe="3600">no</auto_ignore>

    <!-- High-priority paths — alert immediately on change -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/etc</directories>
    <directories check_all="yes" realtime="yes" report_changes="yes">/root</directories>
    <directories check_all="yes" realtime="yes">/bin</directories>
    <directories check_all="yes" realtime="yes">/sbin</directories>
    <directories check_all="yes" realtime="yes">/usr/bin</directories>
    <directories check_all="yes" realtime="yes">/usr/sbin</directories>
    <directories check_all="yes" realtime="yes">/usr/local/bin</directories>

    <!-- Aegis honeypot paths — any change is a critical indicator -->
    <directories check_all="yes" realtime="yes" report_changes="yes">/opt/aegis/honeypot</directories>

    <!-- Cron paths — persistence indicator -->
    <directories check_all="yes" realtime="yes">/etc/cron.d</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.daily</directories>
    <directories check_all="yes" realtime="yes">/etc/cron.weekly</directories>
    <directories check_all="yes" realtime="yes">/var/spool/cron</directories>

    <!-- Systemd units — service persistence -->
    <directories check_all="yes" realtime="yes">/etc/systemd/system</directories>
    <directories check_all="yes" realtime="yes">/lib/systemd/system</directories>

    <!-- Ignore high-churn paths -->
    <ignore>/proc</ignore>
    <ignore>/sys</ignore>
    <ignore>/dev</ignore>
    <ignore>/run</ignore>
    <ignore type="sregex">.log$|.tmp$|.swp$</ignore>
  </syscheck>

  <!-- ── Log Monitoring ──────────────────────────────────────────────── -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <!-- Aegis application logs -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/aegis/*.log</location>
  </localfile>

  <!-- Docker container logs (honeypot services) -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/lib/docker/containers/*/*-json.log</location>
  </localfile>

  <!-- Suricata EVE JSON — forward IDS alerts to Wazuh -->
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
    <label key="@source">suricata</label>
  </localfile>

  <!-- ── Active Response ─────────────────────────────────────────────── -->
  <!-- Block IPs that trigger ≥10 failed SSH logins -->
  <active-response>
    <disabled>no</disabled>
    <command>firewall-drop</command>
    <location>local</location>
    <rules_id>5763</rules_id>   <!-- SSH brute force -->
    <timeout>3600</timeout>
  </active-response>

  <!-- ── Rootcheck ───────────────────────────────────────────────────── -->
  <rootcheck>
    <disabled>no</disabled>
    <check_files>yes</check_files>
    <check_trojans>yes</check_trojans>
    <check_dev>yes</check_dev>
    <check_sys>yes</check_sys>
    <check_pids>yes</check_pids>
    <check_ports>yes</check_ports>
    <check_if>yes</check_if>
    <frequency>3600</frequency>
  </rootcheck>

  <!-- ── Vulnerability Detection ────────────────────────────────────── -->
  <vulnerability-detection>
    <enabled>yes</enabled>
    <index-status>yes</index-status>
    <feed-update-interval>60m</feed-update-interval>
  </vulnerability-detection>
</ossec_config>
